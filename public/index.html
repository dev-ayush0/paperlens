<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PaperLens — Research workspace</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f6f3;--panel:#fff;--panel-2:#f8faf8;--text:#1b211d;--muted:#737c76;
  --line:#e0e6e1;--accent:#176b57;--accent-soft:#e2f0eb;--accent-2:#2f8f72;
  --shadow:0 10px 35px rgba(24,42,32,.07);--radius:18px;
}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:background .2s,color .2s}
body.dark{
  --bg:#101411;--panel:#181d1a;--panel-2:#202622;--text:#edf2ee;--muted:#98a49c;
  --line:#2d3731;--accent:#77c9ad;--accent-soft:#203b31;--accent-2:#58ae90;--shadow:0 10px 35px rgba(0,0,0,.22)
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}
.side{
  position:sticky;top:0;height:100vh;padding:18px 13px;background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20
}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:17px;padding:6px 10px 24px}
.logo{
  width:31px;height:31px;border:2px solid var(--accent);border-radius:10px;
  display:grid;place-items:center;color:var(--accent);font-weight:900
}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#9aa39d;padding:0 11px 7px}
.nav{display:grid;gap:4px}
.nav button{
  width:100%;border:0;background:transparent;color:var(--muted);border-radius:12px;
  text-align:left;padding:11px 12px;display:flex;align-items:center;gap:11px;transition:.16s
}
.nav button:hover{background:var(--panel-2);color:var(--accent);transform:translateX(2px)}
.nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:760}
.ico{width:20px;text-align:center;font-size:16px}
.side-bottom{margin-top:auto}
.side-card{border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:13px;color:var(--muted);font-size:12px}
.side-card b{display:block;color:var(--text);margin-bottom:4px}
.main{width:100%;max-width:1550px;margin:0 auto;padding:22px 28px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;color:var(--muted)}
.settings{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 12px}
.settings:hover{border-color:var(--accent);color:var(--accent)}
.page-head{margin-bottom:18px}
.page-head h1{margin:0 0 6px;font-size:30px;letter-spacing:-.03em}
.page-head p{margin:0;color:var(--muted)}
.eyebrow{color:var(--accent);font-weight:850;letter-spacing:.12em;font-size:10px;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,.75fr);gap:15px}
.hero-card{padding:24px}
.hero-card h2{font-size:36px;line-height:1.02;margin:8px 0 10px;letter-spacing:-.04em}
.hero-card p{color:var(--muted);margin:0}
.search-wrap{position:relative;margin-top:19px}
.search{
  display:flex;align-items:center;gap:4px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:14px;padding:6px;transition:.2s
}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 10%,transparent)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);padding:11px;font-size:15px}
.search .clear{display:none;border:0;background:transparent;color:var(--muted);font-size:23px;width:36px;height:34px;border-radius:9px}
.search .clear:hover{background:var(--accent-soft);color:var(--accent)}
.search .go{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:0 18px;height:38px;font-weight:760}
.search .go:disabled{opacity:.65;cursor:wait}
.suggestions{
  position:absolute;left:0;right:0;top:calc(100% + 8px);display:none;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 45px rgba(0,0,0,.15);overflow:hidden;z-index:15
}
.suggestion{width:100%;border:0;background:transparent;color:var(--text);padding:11px 13px;text-align:left;display:flex;gap:9px;align-items:center}
.suggestion:hover{background:var(--accent-soft);color:var(--accent)}
.suggestion small{margin-left:auto;color:var(--muted)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chip,.pill{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:7px 10px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.cockpit{padding:20px}
.cockpit-title{display:flex;align-items:center;justify-content:space-between}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent-2) 12%,transparent)}
.cockpit p{color:var(--muted);line-height:1.5}
.kv{display:grid;gap:11px;margin-top:14px}
.kv-row{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv-row span{color:var(--muted)}
.kv-row b{text-align:right}
.explore{margin-top:16px;padding:18px}
.explore-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.explore h2{margin:6px 0 3px;font-size:20px}
.explore p{margin:0;color:var(--muted)}
.popular-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:15px}
.popular-item{
  min-height:160px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2);
  transition:.18s
}
.popular-item:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-2px)}
.tag{display:inline-flex;align-items:center;border-radius:999px;background:var(--accent-soft);color:var(--accent);padding:5px 8px;font-size:10px;font-weight:820}
.popular-item h3{font-size:13px;line-height:1.3;margin:9px 0 7px}
.popular-item p{color:var(--muted);font-size:11px;line-height:1.45}
.filters{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:15px 0 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 10px;border-radius:999px}
.tab.active{background:var(--accent-soft);color:var(--accent);font-weight:750}
.sort{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 10px;border-radius:10px}
.results{display:grid;gap:10px}
.paper{
  padding:17px;border:1px solid var(--line);background:var(--panel);border-radius:15px;
  transition:.18s;cursor:pointer
}
.paper:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));box-shadow:0 8px 26px rgba(28,48,37,.08);transform:translateY(-1px)}
.paperhead{display:flex;justify-content:space-between;gap:16px}
.paper h3{margin:0 0 5px;font-size:16px;line-height:1.28}
.paper-meta{color:var(--muted);font-size:12px}
.paper-abstract{margin:9px 0 12px;color:var(--muted);font-size:12px;line-height:1.55}
.paper-actions{display:flex;gap:7px;flex-wrap:wrap}
.action{
  border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:7px 10px
}
.action.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.action:hover{border-color:var(--accent);color:var(--accent)}
.action.primary:hover{color:#fff;filter:brightness(1.05)}
.empty{padding:44px;text-align:center;color:var(--muted)}
.loader{padding:22px}
.loader-title{font-weight:760;margin-bottom:12px}
.loader-sub{color:var(--muted);font-size:12px;margin-top:7px}
.loading-bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.loading-bar i{display:block;width:32%;height:100%;background:var(--accent);border-radius:99px;animation:load 1.2s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(380%)}}
.view-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:15px}
.section-card{padding:18px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-title h2{margin:0;font-size:19px}
.muted{color:var(--muted)}
.library-grid{display:grid;gap:9px}
.saved-item{
  width:100%;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:13px;padding:12px
}
.saved-item:hover{border-color:var(--accent)}
.saved-item .mini-title{font-weight:720;line-height:1.35}
.saved-item .mini-meta{margin-top:5px;font-size:11px;color:var(--muted)}
.history-list{display:grid;gap:9px}
.history-item{padding:14px;border:1px solid var(--line);background:var(--panel);border-radius:13px}
.history-item strong{display:block;margin-bottom:4px}
.history-item span{font-size:11px;color:var(--muted)}
.reader-shell{
  display:grid;grid-template-columns:300px minmax(0,1fr);min-height:760px;overflow:hidden;
  border:1px solid var(--line);border-radius:18px;background:var(--panel)
}
.reader-list{border-right:1px solid var(--line);background:var(--panel-2);padding:12px;overflow:auto}
.reader-list-head{padding:6px 6px 12px}
.reader-list-head h2{margin:0 0 4px;font-size:18px}
.reader-list-head p{margin:0;color:var(--muted);font-size:12px}
.reader-items{display:grid;gap:7px}
.reader-item{
  border:1px solid transparent;background:transparent;border-radius:12px;padding:11px;text-align:left;color:var(--text)
}
.reader-item:hover{background:var(--panel);border-color:var(--line)}
.reader-item.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.reader-item .mini-title{font-weight:720;font-size:12px;line-height:1.35}
.reader-item .mini-meta{font-size:10px;color:var(--muted);margin-top:5px}
.reader-main{display:flex;flex-direction:column;min-width:0}
.reader-toolbar{
  padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:var(--panel)
}
.reader-toolbar .spacer{flex:1}
.reader-body{padding:17px;display:grid;gap:14px;min-width:0}
.reader-title{font-size:24px;line-height:1.1;letter-spacing:-.03em;margin:0}
.reader-meta{color:var(--muted);font-size:12px;margin-top:6px}
.reader-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.reader-stat{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:11px}
.reader-stat b{display:block;font-size:16px}
.reader-stat span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.reader-workspace{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:12px;min-height:500px}
.pdf-panel{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#111;min-height:500px}
.pdf-panel iframe{width:100%;height:100%;min-height:500px;border:0;background:#111}
.pdf-fallback{height:100%;min-height:500px;display:grid;place-items:center;padding:30px;text-align:center;color:#bbb}
.notes-panel{border:1px solid var(--line);border-radius:14px;background:var(--panel-2);padding:13px;display:flex;flex-direction:column;gap:10px}
.notes-tabs{display:flex;gap:5px}
.notes-tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 9px;border-radius:9px}
.notes-tab.active{background:var(--accent-soft);color:var(--accent);font-weight:750}
.notes-content{min-height:0;display:flex;flex-direction:column;gap:9px;flex:1}
.notes-textarea{flex:1;min-height:250px;width:100%;resize:vertical;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);padding:11px;outline:0}
.notes-textarea:focus{border-color:var(--accent)}
.highlight-help{padding:10px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:11px;line-height:1.45}
.note-list,.highlight-list{display:grid;gap:8px;max-height:380px;overflow:auto}
.note-entry,.highlight-entry{padding:10px;border:1px solid var(--line);background:var(--panel);border-radius:10px}
.note-entry small,.highlight-entry small{color:var(--muted)}
.abstract-box{
  border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:14px;line-height:1.6;color:var(--muted)
}
.selectable{user-select:text}
.detail-backdrop,.modal-back{
  position:fixed;inset:0;background:rgba(7,13,10,.68);backdrop-filter:blur(6px);z-index:60;padding:24px;overflow:auto
}
.detail{
  width:min(1100px,100%);margin:20px auto;background:var(--panel);border:1px solid var(--line);
  border-radius:22px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.25)
}
.detail-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:22px 22px 14px}
.detail-top h2{margin:0;font-size:28px;line-height:1.1}
.detail-close{border:0;background:var(--panel-2);color:var(--text);border-radius:10px;padding:8px 11px}
.bento{display:grid;grid-template-columns:1.15fr .85fr;gap:11px;padding:0 22px 22px}
.bento-box{border:1px solid var(--line);background:var(--panel-2);border-radius:15px;padding:15px}
.bento-box.large{grid-row:span 2}
.bento-box h3{margin:0 0 7px;font-size:13px}
.bento-box p{margin:0;color:var(--muted);line-height:1.55;font-size:12px}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.metric{padding:11px;border:1px solid var(--line);background:var(--panel);border-radius:11px}
.metric b{display:block;font-size:15px}
.metric span{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.detail-actions{display:flex;gap:7px;flex-wrap:wrap;padding:0 22px 22px}
.summary-line{font-size:13px!important;color:var(--text)!important}
.modal{width:min(470px,100%);margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.modal-head{display:flex;align-items:center;justify-content:space-between}
.modal-head h2{margin:0}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.switch{width:48px;height:27px;border:0;border-radius:99px;background:#d7ddd9;padding:3px}
.switch i{display:block;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on i{transform:translateX(21px)}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);
  background:#19221d;color:#fff;padding:10px 13px;border-radius:11px;opacity:0;pointer-events:none;
  transition:.2s;z-index:100;font-size:12px
}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:1100px){
  .hero,.view-grid{grid-template-columns:1fr}
  .popular-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .reader-shell{grid-template-columns:250px minmax(0,1fr)}
  .reader-workspace{grid-template-columns:1fr}
}
@media(max-width:850px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:9px 10px}
  .brand{padding:5px 7px 9px}
  .nav{grid-template-columns:repeat(4,1fr)}
  .nav-label,.side-bottom{display:none}
  .nav button{justify-content:center;padding:9px 5px}
  .nav button span:last-child{display:none}
  .main{padding:14px}
  .hero-card h2{font-size:30px}
  .popular-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .reader-shell{grid-template-columns:1fr}
  .reader-list{border-right:0;border-bottom:1px solid var(--line);max-height:250px}
  .reader-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bento{grid-template-columns:1fr}
  .bento-box.large{grid-row:auto}
  .detail-top h2{font-size:23px}
}
@media(max-width:560px){
  .popular-grid{grid-template-columns:1fr}
  .filters{align-items:flex-start;flex-direction:column}
  .paperhead{flex-direction:column}
  .search .go{padding:0 13px}
  .reader-toolbar .spacer{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">P</div><span>PaperLens</span></div>
    <div class="nav-label">Workspace</div>
    <nav class="nav">
      <button data-view="discover" class="active" onclick="showDiscover(this)"><span class="ico">⌕</span><span>Discover</span></button>
      <button data-view="library" onclick="showLibrary(this)"><span class="ico">▱</span><span>My Library <small>(<span id="savedCount">0</span>)</small></span></button>
      <button data-view="history" onclick="showHistory(this)"><span class="ico">◷</span><span>History</span></button>
      <button data-view="reader" onclick="showReader(this)"><span class="ico">▤</span><span>Reader</span></button>
    </nav>
    <div class="side-bottom">
      <div class="side-card"><b>Research cockpit</b><span>Discover openly. Read deeply. Keep your notes with the paper.</span></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar"><span id="topCaption">Research discovery workspace</span><button class="settings" onclick="openSettings()">⚙ Settings</button></div>
    <div id="appView"></div>
  </main>
</div>

<div id="toast" class="toast"></div>

<script>
const $ = (x) => document.querySelector(x);
const STORE_SAVED='paperlens_saved';
const STORE_HISTORY='paperlens_history';
const STORE_NOTES='paperlens_notes';
const STORE_HIGHLIGHTS='paperlens_highlights';
const STORE_METRICS='paperlens_metrics';
const STORE_THEME='paperlens_theme';
let all=[];
let src='all';
let historyList=JSON.parse(localStorage.getItem(STORE_HISTORY)||'[]');
let currentReaderId=null;
let currentReaderTab='notes';

const suggestionData=[
  {q:'incomplete fusion reactions',tag:'Physics'},
  {q:'quantum entanglement',tag:'Physics'},
  {q:'gravitational waves',tag:'Astronomy'},
  {q:'cosmic inflation',tag:'Astronomy'},
  {q:'transformer attention mechanisms',tag:'AI'},
  {q:'deep learning',tag:'AI'},
  {q:'large language models',tag:'AI'},
  {q:'computer vision',tag:'Tech'},
  {q:'human genome sequencing',tag:'Bio'},
  {q:'CRISPR gene editing',tag:'Bio'},
  {q:'machine learning materials science',tag:'Chem'},
  {q:'catalysis',tag:'Chem'},
  {q:'semiconductor physics',tag:'Tech'},
  {q:'quantum computing',tag:'Tech'}
];

const popularPapers=[
  {title:'Attention Is All You Need',tag:'AI',q:'Attention Is All You Need',desc:'The Transformer architecture that reshaped modern language models.'},
  {title:'Observation of Gravitational Waves from a Binary Black Hole Merger',tag:'Astronomy',q:'gravitational waves binary black hole merger',desc:'A landmark search entry point for gravitational-wave astronomy.'},
  {title:'Deep Residual Learning for Image Recognition',tag:'AI',q:'Deep Residual Learning for Image Recognition',desc:'The ResNet paper and the residual-learning idea behind it.'},
  {title:'Initial sequencing and analysis of the human genome',tag:'Bio',q:'human genome sequencing',desc:'A landmark publication in modern genomics.'},
  {title:'The Structure of Graphene',tag:'Chem / Materials',q:'graphene structure',desc:'A starting point for two-dimensional materials research.'},
  {title:'Cosmological Inflation and Large-Scale Structure',tag:'Physics / Astronomy',q:'cosmological inflation large scale structure',desc:'Explore the link between inflation and structure formation.'},
  {title:'Incomplete Fusion Reactions at Intermediate Energies',tag:'Physics',q:'incomplete fusion reactions',desc:'A useful starting search for nuclear-reaction research.'},
  {title:'AlphaFold: A Solution to a 50-Year-Old Grand Challenge in Biology',tag:'Bio / AI',q:'AlphaFold solution biology',desc:'AI applied to protein-structure prediction.'},
  {title:'Quantum Computation and Quantum Information',tag:'Tech / Physics',q:'quantum computation quantum information',desc:'A broad entry point into quantum information.'},
  {title:'Machine Learning for Materials Science',tag:'Chem / Tech',q:'machine learning materials science',desc:'The intersection of AI, chemistry and materials.'}
];

function esc(s){
  return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function getSaved(){return JSON.parse(localStorage.getItem(STORE_SAVED)||'[]')}
function setSaved(v){localStorage.setItem(STORE_SAVED,JSON.stringify(v))}
function getNotes(){return JSON.parse(localStorage.getItem(STORE_NOTES)||'{}')}
function setNotes(v){localStorage.setItem(STORE_NOTES,JSON.stringify(v))}
function getHighlights(){return JSON.parse(localStorage.getItem(STORE_HIGHLIGHTS)||'{}')}
function setHighlights(v){localStorage.setItem(STORE_HIGHLIGHTS,JSON.stringify(v))}
function getMetrics(){return JSON.parse(localStorage.getItem(STORE_METRICS)||'{}')}
function setMetrics(v){localStorage.setItem(STORE_METRICS,JSON.stringify(v))}
function syncSavedCount(){let n=getSaved().length;$('#savedCount').textContent=n}
function activate(btn){
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
  if(btn)btn.classList.add('active');
}
function navButton(view){return document.querySelector('[data-view="'+view+'"]')}
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);
  toast.timer=setTimeout(()=>t.classList.remove('show'),1800);
}
function metricFor(id){

async function search(){

  if(!text){toast('Select some text in the abstract first');return}
  const h=getHighlights();h[id]=h[id]||[];h[id].push({text:text,time:Date.now()});setHighlights(h);currentReaderTab='highlights';renderReader();toast('Highlight saved');
}
function deleteHighlight(id,i){
  const h=getHighlights();h[id]=(h[id]||[]).filter((_,idx)=>idx!==i);setHighlights(h);renderReader();
}
async function generateReaderSummary(id){
  const p=findPaper(id);if(!p)return;currentReaderTab='brief';renderReaderSide(p);
  const target=$('#readerSummary');if(!target)return;target.textContent='Generating a concise paper brief…';
  try{
    const r=await fetch('/api/summarize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:p.title,abstract:p.abstract||''})});
    const d=await r.json();if(!r.ok)throw Error(d.error||'Summary failed');target.textContent=d.summary||localSummary(p);
  }catch(e){target.textContent=localSummary(p);toast('Using the local summary')}
}
function markRead(id){
  bumpMetric(id,'readCount');toast('Marked as read');
  if(location.hash==='#reader')renderReader();
}
function openReaderFor(id){
  currentReaderId=id;currentReaderTab='notes';activate(navButton('reader'));location.hash='reader';renderReader();
}
function readerPrev(){
  const s=getSaved(),i=s.findIndex(x=>x.id===currentReaderId);if(i>0){currentReaderId=s[i-1].id;renderReader()}
}
function readerNext(){
  const s=getSaved(),i=s.findIndex(x=>x.id===currentReaderId);if(i>=0&&i<s.length-1){currentReaderId=s[i+1].id;renderReader()}
}
function openSettings(){
  const dark=document.body.classList.contains('dark');
  const back=document.createElement('div');back.className='modal-back';back.id='settingsModal';back.onclick=e=>{if(e.target===back)closeSettings()};
  back.innerHTML='<div class="modal"><div class="modal-head"><h2>Settings</h2><button class="detail-close" onclick="closeSettings()">×</button></div>'+
    '<div class="setting-row"><div><b>Dark mode</b><div class="muted" style="margin-top:3px">Use a darker research workspace.</div></div><button class="switch '+(dark?'on':'')+'" id="themeSwitch" onclick="toggleTheme()"><i></i></button></div>'+
    '<div class="setting-row"><div><b>Saved papers</b><div class="muted" style="margin-top:3px">Stored locally in this browser.</div></div><button class="action" onclick="clearLibrary();closeSettings()">Clear</button></div>'+
    '<div style="padding-top:15px;color:var(--muted);font-size:12px;line-height:1.5">PaperLens currently keeps library, notes, highlights and history on this device. Cloud sync can be added later without changing the reading workflow.</div>'+
  '</div>';
  document.body.appendChild(back);
}
function closeSettings(){const x=$('#settingsModal');if(x)x.remove()}
function toggleTheme(){
  const on=!document.body.classList.contains('dark');document.body.classList.toggle('dark',on);localStorage.setItem(STORE_THEME,on?'dark':'light');
  const sw=$('#themeSwitch');if(sw)sw.classList.toggle('on',on);
}
function boot(){
  if(localStorage.getItem(STORE_THEME)==='dark')document.body.classList.add('dark');
  syncSavedCount();
  const hash=location.hash;
  if(hash==='#library')showLibrary(navButton('library'));
  else if(hash==='#history')showHistory(navButton('history'));
  else if(hash==='#reader')showReader(navButton('reader'));
  else{showDiscover(navButton('discover'))}
}
function showDiscover(btn){
  activate(btn||navButton('discover'));location.hash='discover';src='all';all=[];renderDiscover();
}
boot();
</script>
</body>
</html>
